steps:
- as: usdc
  signer: deployer
  deploy: StableToken
  args:
  - 1000000000000
- as: nft
  signer: deployer
  deploy: CollectionV2
- as: market
  signer: deployer
  deploy: Market
  args:
  - $usdc
  - 250
  - false
- signer: deployer
  to: $nft
  function: mint
  args:
  - $alice
  - 7
- signer: alice
  to: $market
  function: list
  args:
  - $nft
  - 7
  - 150000000
