steps:
- as: payment
  signer: deployer
  deploy: StableToken
  args:
  - 10000
- as: nft
  signer: deployer
  deploy: RoyaltyCollection
  args:
  - $carol
  - 1000
- as: market
  signer: deployer
  deploy: Market15
  args:
  - $payment
- signer: deployer
  to: $payment
  function: transfer
  args:
  - $bob
  - 100
- signer: deployer
  to: $nft
  function: mint
  args:
  - $alice
  - 7
- signer: alice
  to: $nft
  function: approve
  args:
  - $market
  - 7
- signer: bob
  to: $payment
  function: approve
  args:
  - $market
  - 100
- signer: bob
  to: $market
  function: makeOffer
  args:
  - $nft
  - 7
  - 100
- signer: deployer
  to: $market
  function: setEnforcement
  args:
  - true
