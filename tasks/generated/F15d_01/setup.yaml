steps:
- as: payment
  signer: deployer
  deploy: StableToken
  args:
  - 100000000000
- as: nft
  signer: deployer
  deploy: MutableMetadataCollection
  args: []
- as: market
  signer: deployer
  deploy: Market
  args:
  - $payment
  - 0
  - false
- signer: deployer
  to: $payment
  function: transfer
  args:
  - $alice
  - 200000000
- signer: deployer
  to: $nft
  function: mint
  args:
  - $bob
  - 9
- signer: bob
  to: $nft
  function: approve
  args:
  - $market
  - 9
- signer: bob
  to: $market
  function: list
  args:
  - $nft
  - 9
  - 100000000
- signer: deployer
  to: $nft
  function: setTokenURI
  args:
  - 9
  - '{"name":"Item #9","description":"Catalog item #9"}'
