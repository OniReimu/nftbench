steps:
- as: usdc
  signer: deployer
  deploy: StableToken
  args:
  - 1000000000000
- as: nft
  signer: deployer
  deploy: RoyaltyCollection
  args:
  - $carol
  - 1500
- as: market
  signer: deployer
  deploy: Market
  args:
  - $usdc
  - 250
  - true
- signer: deployer
  to: $nft
  function: mint
  args:
  - $dave
  - 7
- signer: dave
  to: $market
  function: list
  args:
  - $nft
  - 7
  - 1000000000
- signer: dave
  to: $nft
  function: approve
  args:
  - $market
  - 7
- signer: deployer
  to: $usdc
  function: transfer
  args:
  - $alice
  - 2000000000
