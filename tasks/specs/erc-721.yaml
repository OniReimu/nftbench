erc_id: ERC-721
url: https://eips.ethereum.org/EIPS/eip-721
retrieved: '2026-10-30'
note: Verbatim excerpts from the page at url.
sections:
  Transfers: "    /// @dev Throws unless `msg.sender` is the current owner, an authorized\n    ///  operator, or the approved address for this NFT. Throws if `_from` is\n    ///  not the current owner. Throws if `_to` is the zero address. Throws if\n    ///  `_tokenId` is not a valid NFT."
  Approvals: "    /// @dev The zero address indicates there is no approved address.\n    ///  Throws unless `msg.sender` is the current NFT owner, or an authorized\n    ///  operator of the current owner."
  Approval reset on transfer: "    ///  may be created and assigned without emitting Transfer. At the time of\n    ///  any transfer, the approved address for that NFT (if any) is reset to none."
