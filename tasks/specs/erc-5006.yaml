erc_id: ERC-5006
url: https://eips.ethereum.org/EIPS/eip-5006
retrieved: '2026-11-01'
note: Verbatim excerpts from the page at url.
sections:
  Abstract: This standard is an extension of ERC-1155. It proposes an additional role (user) which can be granted to addresses that represent a user of the assets rather than an owner.
  Contract Interface: "interface IERC5006 {\n    struct UserRecord {\n        uint256 tokenId;\n        address owner;\n        uint64 amount;\n        address user;\n        uint64 expiry;\n    }\n    \n    /**\n     * @dev Emitted when permission for `user` to use `amount` of `tokenId` token owned by `owner`\n     * until `expiry` are given.\n     */\n    event CreateUserRecord(\n        uint256 recordId,\n        uint256 tokenId,\n        uint64  amount,\n        address owner,\n        address user,\n        uint64  expiry\n    );\n\n    /**\n     * @dev Emitted when record of `recordId` are deleted. \n     */\n    event DeleteUserRecord(uint256 recordId);\n\n    /**\n     * @dev Returns the usable amount of `tokenId` tokens  by `account`.\n     */\n    function usableBalanceOf(address account, uint256 tokenId)\n        external\n        view\n        returns (uint256);\n\n    /**\n     * @dev Returns the amount of frozen tokens of token type `id` by `account`.\n     */\n    function\
    \ frozenBalanceOf(address account, uint256 tokenId)\n        external\n        view\n        returns (uint256);\n\n    /**\n     * @dev Returns the `UserRecord` of `recordId`.\n     */\n    function userRecordOf(uint256 recordId)\n        external\n        view\n        returns (UserRecord memory);\n\n    /**\n     * @dev Gives permission to `user` to use `amount` of `tokenId` token owned by `owner` until `expiry`.\n     *\n     * Emits a {CreateUserRecord} event.\n     *\n     * Requirements:\n     *\n     * - If the caller is not `owner`, it must be have been approved to spend ``owner``'s tokens\n     * via {setApprovalForAll}.\n     * - `owner` must have a balance of tokens of type `id` of at least `amount`.\n     * - `user` cannot be the zero address.\n     * - `amount` must be greater than 0.\n     * - `expiry` must after the block timestamp.\n     */\n    function createUserRecord(\n        address owner,\n        address user,\n        uint256 tokenId,\n        uint64 amount,\n\
    \        uint64 expiry\n    ) external returns (uint256);\n\n    /**\n     * @dev Atomically delete `record` of `recordId` by the caller.\n     *\n     * Emits a {DeleteUserRecord} event.\n     *\n     * Requirements:\n     *\n     * - the caller must have allowance.\n     */\n    function deleteUserRecord(uint256 recordId) external;\n}"
  Rules on transfer and frozen balance: "* Requirements:\n     *\n     * - If the caller is not `owner`, it must be have been approved to spend ``owner``'s tokens\n     * via {setApprovalForAll}.\n     * - `owner` must have a balance of tokens of type `id` of at least `amount`.\n     * - `user` cannot be the zero address.\n     * - `amount` must be greater than 0.\n     * - `expiry` must after the block timestamp.\n     */\n    function createUserRecord(\n        address owner,\n        address user,\n        uint256 tokenId,\n        uint64 amount,\n        uint64 expiry\n    ) external returns (uint256);\n\n    /**\n     * @dev Atomically delete `record` of `recordId` by the caller.\n     *\n     * Emits a {DeleteUserRecord} event.\n     *\n     * Requirements:\n     *\n     * - the caller must have allowance.\n     */\n    function deleteUserRecord(uint256 recordId) external;\n\nClear Rights Assignment:\nWith Dual \u201Cowner\u201D and \u201Cuser\u201D roles, it becomes significantly\
    \ easier to manage what lenders and borrowers can and cannot do with the NFT (in other words, their rights).\_ For example, for the right to transfer ownership,\_the project simply needs to check whether the address taking the action represents the owner or the user and prevent the transaction if it is the user.\_ Additionally, owners can control who the user is and it is easy for other projects to assign their own rights to either the owners or the users.\n\nSecurity Considerations:\nThis EIP standard can completely protect the rights of the owner, the owner can change the NFT user, the user can not transfer the NFT."
