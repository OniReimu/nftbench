steps:
- signer: deployer
  args:
  - https://uri/
  - '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
  deploy_real: rc14
  as: target
- signer: deployer
  to: $target
  function: setMintConfig
  args:
  - true
  - true
- signer: alice
  to: $target
  function: freeMint
  args: []
- signer: deployer
  deploy: StableToken
  as: payment
  args:
  - 20000
- signer: deployer
  deploy: Market
  as: market
  args:
  - $payment
  - 0
  - true
- signer: deployer
  to: $payment
  function: transfer
  args:
  - $bob
  - 10000
- signer: bob
  to: $payment
  function: approve
  args:
  - $market
  - 10000
- signer: bob
  to: $market
  function: makeOffer
  args:
  - $target
  - 1
  - 10000
