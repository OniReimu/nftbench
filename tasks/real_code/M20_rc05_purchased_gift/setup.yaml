steps:
- signer: deployer
  args:
  - NFT
  - NFT
  - https://uri/
  - '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
  - 500
  deploy_real: rc05
  as: target
- signer: deployer
  to: $target
  function: setAccountManager
  args:
  - $deployer
  - 2
- signer: deployer
  to: $target
  function: execute
  args:
  - - '0x5fbdb2315678afecb367f032d93f642f64180aa3'
    - '0x0000000000000000000000000000000000000000'
    - '0x70997970C51812dc3A010C7d01b50e0d17dc79C8'
    - - 1
    - - 1
    - - true
- signer: deployer
  deploy: StableToken
  as: payment
  args:
  - 20000
- signer: deployer
  deploy: Market
  as: market
  args:
  - $payment
  - 0
  - true
- signer: alice
  to: $target
  function: approve
  args:
  - $market
  - 1
- signer: alice
  to: $market
  function: list
  args:
  - $target
  - 1
  - 6000
- signer: deployer
  to: $payment
  function: transfer
  args:
  - $bob
  - 7000
