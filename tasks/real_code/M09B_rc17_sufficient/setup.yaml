steps:
- signer: deployer
  args:
  - '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
  deploy_real: rc17
  as: target
- signer: deployer
  to: $target
  function: safeMint
  args:
  - $alice
  - uri
- signer: alice
  to: $target
  function: transferFrom
  args:
  - $alice
  - $bob
  - 0
- signer: deployer
  deploy: StableToken
  as: payment
  args:
  - 20000
- signer: deployer
  deploy: Market
  as: market
  args:
  - $payment
  - 0
  - false
- signer: bob
  to: $target
  function: approve
  args:
  - $market
  - 0
- signer: bob
  to: $market
  function: list
  args:
  - $target
  - 0
  - 1000
- signer: deployer
  to: $payment
  function: transfer
  args:
  - $alice
  - 1000
