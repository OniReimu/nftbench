steps:
- signer: deployer
  deploy_real: rc04
  as: implementation
- signer: deployer
  args:
  - $implementation
  - ''
  deploy_real_proxy: $implementation
  as: target
- signer: deployer
  to: $target
  function: grantRole
  args:
  - '0x9f2df0fed2c77648de5860a4cc508cd0818c85b8b8a1ab4ceeef8d981c8956a6'
  - $deployer
- signer: deployer
  to: $target
  function: mint
  args:
  - $alice
- signer: deployer
  to: $target
  function: setTokenLocked
  args:
  - 1
  - false
- signer: deployer
  deploy: StableToken
  as: payment
  args:
  - 20000
- signer: deployer
  deploy: Market
  as: market
  args:
  - $payment
  - 0
  - true
- signer: deployer
  to: $payment
  function: transfer
  args:
  - $bob
  - 10000
- signer: bob
  to: $payment
  function: approve
  args:
  - $market
  - 10000
- signer: bob
  to: $market
  function: makeOffer
  args:
  - $target
  - 1
  - 10000
